[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-aether"
version = "0.1.0"
description = "Motor-driven quadrotor simulation and predictive autonomy research foundation"
requires-python = ">=3.11"
dependencies = ["numpy>=2.1,<3", "scipy>=1.14,<2"]

[project.optional-dependencies]
assets = ["remotezip==0.12.6", "pyproj>=3.6,<4", "requests>=2.31,<3", "usd-core>=25,<27", "pillow>=11,<14", "fast-simplification==0.2.0"]
viewer = ["panda3d==1.10.16"]
learning = ["torch>=2.6,<3"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "clang-format==19.1.7"]

[project.scripts]
aether = "aether.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
